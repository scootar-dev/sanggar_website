name: Auto Deploy CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy ke VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          timeout: 60s
          command_timeout: 30m
          script: |
            if [ ! -d "/home/miomideveloper/web-sanggar/.git" ]; then
              git clone git@github.com:scootar-dev/sanggar_website.git /home/miomideveloper/web-sanggar
            fi
            git config --global --add safe.directory /home/miomideveloper/web-sanggar
            cd /home/miomideveloper/web-sanggar
            git fetch --all
            git reset --hard origin/main
            chmod +x deploy.sh
            bash deploy.sh

      # ─── NOTIFIKASI FINAL DEPLOY SUCCESS ───
      - name: 📢 Telegram Notification (Deploy Success)
        if: success()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d parse_mode="Markdown" \
            -d disable_web_page_preview=true \
            -d text="🚀 *[CICD REPORT]* %0A✅ *DEPLOYMENT SANGGAR BERHASIL!* %0A%0AAplikasi Sanggar Mulya Bhakti terbaru sudah aktif di VPS.%0AAktor: *${{ github.actor }}* %0ACommit: [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})"

      # ─── NOTIFIKASI FINAL DEPLOY FAILED ───
      - name: ❌ Telegram Notification (Deploy Failed)
        if: failure()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d parse_mode="Markdown" \
            -d text="⚠️ *[CICD REPORT]* %0A❌ *DEPLOYMENT SANGGAR GAGAL!* %0A%0AProses SSH atau deployment di VPS mengalami kendala.%0ACommit: ${{ github.sha }}"
