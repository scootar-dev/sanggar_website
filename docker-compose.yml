services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: sanggar-web
    container_name: sanggar-web
    restart: always
    ports:
      - "8087:80"
    volumes:
      # Persist storage directory for uploads/logs
      - ./storage:/var/www/html/storage
      # Mount environment file to prevent losing settings
      - ./.env:/var/www/html/.env
    networks:
      - db_network
      - npm_network

networks:
  db_network:
    external: true
    name: bimbelrbs_network
  npm_network:
    external: true
    name: npm_default
